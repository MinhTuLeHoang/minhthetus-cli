name: PR Build and Test

on:
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run Build
        run: |
          go build -o minhthetus-cli main.go

      - name: Run Unit Tests
        id: run_tests
        run: |
          go test ./...
        continue-on-error: true

      - name: Warn on Test Failure
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "::warning file=go.mod::Unit tests failed! Please review test failures."
